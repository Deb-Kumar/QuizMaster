name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Successfully restored google-services.json from repository secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not configured. Generating fallback config for CI build."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "475100234962",
              "project_id": "quizmaster-dd2f8",
              "storage_bucket": "quizmaster-dd2f8.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:475100234962:android:c824cf3118bf0245e1990b",
                  "android_client_info": {
                    "package_name": "com.example.onlinequizapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyMockKeyForCIBuilds0000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Security Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/*.apk "QuizMaster-${TAG_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "QuizMaster ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: QuizMaster-*.apk
          generate_release_notes: true
