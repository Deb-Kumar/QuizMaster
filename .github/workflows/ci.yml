name: CI - Android Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_and_build:
    name: Run Unit Tests & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Successfully restored google-services.json from repository secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not configured. Generating fallback config for CI build."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "475100234962",
              "project_id": "quizmaster-dd2f8",
              "storage_bucket": "quizmaster-dd2f8.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:475100234962:android:c824cf3118bf0245e1990b",
                  "android_client_info": {
                    "package_name": "com.example.onlinequizapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyMockKeyForCIBuilds0000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Security Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizmaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
